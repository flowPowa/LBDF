<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable — La Boutique de Flow</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Press+Start+2P&family=Rubik:wght@400;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem; background: #1E1847; color: #fff; font: 1.0625rem/1.6 "Rubik", sans-serif; }
  .boite { max-width: 34rem; background: #2A2266; border: 4px solid #fff; border-radius: 10px; box-shadow: inset 0 0 0 4px #1E1847, inset 0 0 0 6px #fff; padding: 2rem; }
  h1 { font: 400 clamp(3rem, 12vw, 5rem)/1 "Bungee", sans-serif; color: #FFD23F; text-shadow: .04em .04em 0 #3DE0E6; margin: 0 0 1rem; }
  p { margin: 0 0 1rem; }
  a { font: .8rem "Press Start 2P", monospace; color: #fff; text-decoration: none; display: inline-flex; min-height: 44px; align-items: center; }
  a::before { content: "▶"; color: #FFD23F; margin-right: .6em; }
  a:focus-visible { outline: 3px solid #FFD23F; outline-offset: 3px; }
</style>
</head>
<body>
  <main class="boite">
    <h1>404</h1>
    <p>Cette page n'existe pas. L'adresse est peut-être mal tapée, ou la page a été déplacée.</p>
    <a href="/">Retour à l'accueil</a>
  </main>
</body>
</html>
